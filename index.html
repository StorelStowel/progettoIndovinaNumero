<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Document</title>
</head>
<body class="text-center p-4">
    <div class="p-2 border border-4 border-black bg-white">
        <h1 class="fw-bold">Number Guessing Game</h1>
        <h2><i class="bi bi-arrow-right-circle" id="bottoneIstruzioni" onclick="istruzioni()"></i> Istruzioni</h2>
        <div class="d-none" id="istruzioni">
            <p>inserisci blah blah blah</p>
        </div>
        <button type="button" class="btn btn-primary" onclick="gioca()" id="bottoneGioca">Gioca</button>
    </div>

    <div class="mt-4 p-2 border border-4 bg-white d-none" id="gioco">
        <input type="number" name="" id="input">
        <button type="button" class="btn btn-primary d-inline" onclick="indovina()">Check</button>
        
        
        <div class="row">
            <div class="col-12 col-sm-4">
                <h3>Tentativi rimasti</h3>
                <i class="bi bi-joystick fs-1"></i>
                <p id="tentativi">7</p>
            </div>
            <div class="col-12 col-sm-4">
                <h3>Suggerimenti</h3>
                <i class="bi bi-info-square fs-1"></i>
                <p class="fst-italic text-primary" id="suggerimento"></p>
            </div>
            <div class="col-12 col-sm-4">
                <h3>Numeri inseriti</h3>
                <i class="bi bi-pencil-square fs-1"></i>
                <p id="vettore"></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./JS/script.js"></script>
</body>
</html>
